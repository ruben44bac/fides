# The nodes that serve the API, the back office and the inbound webhooks. They
# enqueue jobs and run none, so they scale on requests alone.
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app.kubernetes.io/name: fides
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 4000
      targetPort: 4000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fides
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fides
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: fides
          command: ["/app/bin/server"]
          env:
            - name: FIDES_ROLE
              value: web
          envFrom:
            - configMapRef:
                name: fides-env
            - secretRef:
                name: fides-keys
          ports:
            - name: http
              containerPort: 4000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 1Gi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
