# The nodes that take every queue: the orchestrator's steps, the agents, one queue per
# bank provider, the notifier and the AI. They serve nothing, and are the only ones
# that reach the providers. Scale them on the depth of oban_jobs, which the console
# shows; a custom metric for that is not in this delivery.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fides
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fides
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: worker
          image: fides
          command: ["/app/bin/fides", "start"]
          env:
            - name: FIDES_ROLE
              value: worker
          envFrom:
            - configMapRef:
                name: fides-env
            - secretRef:
                name: fides-keys
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 1Gi
