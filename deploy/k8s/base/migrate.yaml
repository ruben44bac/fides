# Creates the database if missing, migrates and seeds, before the nodes start. The
# job removes itself five minutes after it is done, so the next apply runs it again.
apiVersion: batch/v1
kind: Job
metadata:
  name: fides-migrate
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fides
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: fides
          command: ["/app/bin/setup"]
          envFrom:
            - configMapRef:
                name: fides-env
            - secretRef:
                name: fides-keys
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 512Mi
