# A local cluster on kind: the images built on this machine, the development keys
# `make deploy` writes to keys.env, and the web and the mocks reachable from the host
# on ports 30400 and 30410.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fides

resources:
  - namespace.yaml
  - ../../base

images:
  - name: ghcr.io/ruben44bac/fides
    newName: fides
    newTag: local
  - name: ghcr.io/ruben44bac/fides-mocks
    newName: fides-mocks
    newTag: local

secretGenerator:
  - name: fides-keys
    envs:
      - keys.env

patches:
  - path: nodeports.yaml
