name: fides

# `docker compose -f deploy/compose.yml up -d --wait` starts PostgreSQL alone, for
# development from the host. With `--profile app` it also runs Fides from its image:
# the migrations and seeds once, a web node, a worker and the simulated providers, so
# a machine with only Docker runs everything (`make run`). The keys in compose.env are
# generated by `make keys`.

x-fides: &fides
  image: ${FIDES_IMAGE:-ghcr.io/ruben44bac/fides:main}
  build:
    context: ..
    dockerfile: deploy/Dockerfile
    args:
      FIDES_CODE_SHA: ${FIDES_CODE_SHA:-unknown}
  pull_policy: missing
  profiles: [app]
  env_file: compose.env
  environment: &fides-env
    DATABASE_URL: ecto://postgres:postgres@postgres:5432/fides
    PHX_HOST: localhost
    PORT: "4000"
    FIDES_PLAIN_HTTP_HOSTS: web
    FIDES_PROVIDERS_URL: http://mocks:4010
    FIDES_PROVIDER_WEBHOOK_SECRET: fides development provider webhook secret
    FIDES_WEBHOOK_RECEIVER_URL: http://mocks:4010/webhooks
    FIDES_WEBHOOK_RECEIVER_SECRET: fides development webhook receiver secret
    FIDES_DEMO_TOTP_SEED: fides development totp seed
    FIDES_LLM_MODEL: ${FIDES_LLM_MODEL:-}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "${FIDES_DB_PORT:-5434}:5432"
    volumes:
      # Since PostgreSQL 18 the image keeps PGDATA under /var/lib/postgresql/18/docker,
      # so the volume mounts the parent directory.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Creates the database if missing, migrates and seeds, then exits
  migrate:
    <<: *fides
    command: /app/bin/setup
    depends_on:
      postgres:
        condition: service_healthy

  # Serves the API, the back office and the inbound webhooks; enqueues jobs, runs none
  web:
    <<: *fides
    command: /app/bin/server
    environment:
      <<: *fides-env
      FIDES_ROLE: web
    ports:
      - "${FIDES_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/health"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 20s

  # Takes every queue: the orchestrator, the agents, the providers, the notifier
  worker:
    <<: *fides
    command: /app/bin/fides start
    environment:
      <<: *fides-env
      FIDES_ROLE: worker
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # The six simulated bank providers and the webhook receiver
  mocks:
    image: ${MOCKS_IMAGE:-ghcr.io/ruben44bac/fides-mocks:main}
    build:
      context: ../mocks
    pull_policy: missing
    profiles: [app]
    environment:
      MOCKS_PORT: "4010"
      MOCKS_FIDES_URL: http://web:4000
      MOCKS_WEBHOOK_SECRET: fides development provider webhook secret
      MOCKS_RECEIVER_SECRET: fides development webhook receiver secret
    ports:
      - "${MOCKS_PORT:-4010}:4010"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4010/webhooks"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  postgres-data:
