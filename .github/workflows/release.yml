name: Release

# Every merge to main publishes the image and deploys the hosted demo from it
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  GHCR_MOCKS_IMAGE: ghcr.io/${{ github.repository }}-mocks
  FLY_IMAGE: registry.fly.io/fides-demo
  FLY_MOCKS_IMAGE: registry.fly.io/fides-demo-mocks

jobs:
  image:
    name: Build and publish the image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - run: flyctl auth docker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # One build, one digest, two registries. Provenance is off so the Fly
      # registry receives a plain single-platform manifest.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          build-args: FIDES_CODE_SHA=${{ github.sha }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ github.sha }}
            ${{ env.GHCR_IMAGE }}:main
            ${{ env.FLY_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The simulated providers and receiver, for the demo
      - uses: docker/build-push-action@v6
        with:
          context: mocks
          file: mocks/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.GHCR_MOCKS_IMAGE }}:${{ github.sha }}
            ${{ env.GHCR_MOCKS_IMAGE }}:main
            ${{ env.FLY_MOCKS_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=mocks
          cache-to: type=gha,mode=max,scope=mocks

  demo:
    name: Deploy the hosted demo
    needs: image
    runs-on: ubuntu-latest
    environment:
      name: demo
      url: https://fides-demo.fly.dev
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - run: flyctl deploy --config deploy/fly/mocks.fly.toml --image ${{ env.FLY_MOCKS_IMAGE }}:${{ github.sha }} --ha=false

      - run: flyctl deploy --config deploy/fly/fly.toml --image ${{ env.FLY_IMAGE }}:${{ github.sha }} --ha=false

      - run: curl --fail --silent --show-error --retry 5 --retry-delay 10 --retry-all-errors https://fides-demo.fly.dev/health
